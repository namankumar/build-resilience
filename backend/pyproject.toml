[tool.poetry]
name = "backend"
version = "0.1.0"
description = "FastAPI backend for Codex Project Plan"
authors = ["Codex"]
packages = [ { include = "app" } ]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "*"
uvicorn = "*"
httpx = "<0.25"

[tool.poetry.group.dev.dependencies]
pytest = "*"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
